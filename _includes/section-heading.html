<header class="section-heading">
  <div>
    {% if include.label %}<p class="eyebrow">{{ include.label }}</p>{% endif %}
    <h2>{{ include.title }}</h2>
  </div>
  {% if include.url %}<a class="text-link" href="{{ include.url | relative_url }}">{{ include.link_text }} <svg class="out-arrow" aria-hidden="true" viewBox="0 0 16 16" fill="none"><path d="M3 13 13 3M3 3h10v10" stroke="currentColor" stroke-width="1.3"/></svg></a>{% endif %}
</header>
