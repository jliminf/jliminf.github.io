name: Check site
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build GitHub Pages site
        run: bundle exec jekyll build --trace
      - name: Check portfolio links
        run: python3 scripts/check_links.py _site
